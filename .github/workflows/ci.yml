name: CI

# Testes e compilação em todo push/PR, no Windows e no Linux.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Dependências do Linux
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev
      - run: npm ci
      - name: Interface (TypeScript)
        run: npm run build
      - name: Testes
        working-directory: src-tauri
        run: cargo test --lib
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
